name: Sync

on:
  schedule:
    # Check for new TypeScript 7+ releases daily
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "TypeScript tag to sync (e.g. v7.0.2). Empty = latest stable >= v7.0.0"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target TypeScript tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            # Latest stable release tag matching vMAJOR.MINOR.PATCH with MAJOR >= 7
            TAG="$(gh api repos/microsoft/TypeScript/releases --paginate \
              --jq '[.[] | select(.prerelease==false and .draft==false) | .tag_name
                    | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    | select(capture("^v(?<maj>[0-9]+)"; "g").maj | tonumber >= 7)]
                   | .[0]')"
          fi
          if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
            echo "No suitable TypeScript tag found"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved TypeScript tag: ${TAG}"

      - name: Ensure submodule sparse-checkout at target tag
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git submodule sync -- microsoft/TypeScript
          # Shallow fetch of the release tag only (no nested submodules)
          git submodule update --init --depth 1 microsoft/TypeScript
          git -C microsoft/TypeScript fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git -C microsoft/TypeScript checkout -f "${TAG}"
          git -C microsoft/TypeScript sparse-checkout init --cone || true
          git -C microsoft/TypeScript sparse-checkout set tsc
          git add microsoft/TypeScript .gitmodules
          CURRENT="$(git -C microsoft/TypeScript describe --tags --exact-match HEAD)"
          echo "Submodule now at ${CURRENT}"
          test "${CURRENT}" = "${TAG}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sync script
        env:
          SYNC_GENERATE: full
          SYNC_MOD_ALIGN: shared
          SYNC_MOD_DRIFT_CHECK: "1"
          SYNC_VERBOSE: "0"
          SYNC_TS_SYMLINK: "1"
          SYNC_TS_SYMLINK_CLEAN: "1"
        run: |
          chmod +x scripts/sync-internal.sh
          ./scripts/sync-internal.sh

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(sync): TypeScript ${{ steps.target.outputs.tag }}"
          title: "chore(sync): TypeScript ${{ steps.target.outputs.tag }}"
          body: |
            Automated synchronization from microsoft/TypeScript `${{ steps.target.outputs.tag }}`:

            - Pin submodule `microsoft/TypeScript` to the release tag
            - Copy `tsc/internal` → `pkg`
            - Rewrite imports and normalize `//go:generate`
            - Copy `tsc/testdata` → `testdata`
            - `go mod tidy`

            After merge (with the `sync` label), `release.yml` will tag this repo `${{ steps.target.outputs.tag }}` and goreleaser will create a GitHub Release.
          branch: chore/sync-typescript-${{ steps.target.outputs.tag }}
          branch-suffix: timestamp
          delete-branch: true
          labels: |
            sync
            chore
            automated
          draft: false
