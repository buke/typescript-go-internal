name: Sync

on:
  schedule:
    # Check for new TypeScript 7+ releases daily
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "TypeScript tag to sync (e.g. v7.0.2). Empty = latest stable >= v7.0.0"
        required: false
        type: string
        default: ""
      force:
        description: "Re-run sync even when submodule is already on the target tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target TypeScript tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force || false }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            # Latest stable release tag matching vMAJOR.MINOR.PATCH with MAJOR >= 7
            TAG="$(gh api repos/microsoft/TypeScript/releases --paginate \
              --jq '[.[] | select(.prerelease==false and .draft==false) | .tag_name
                    | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    | select(capture("^v(?<maj>[0-9]+)"; "g").maj | tonumber >= 7)]
                   | .[0]')"
          fi
          if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
            echo "No suitable TypeScript tag found"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved TypeScript tag: ${TAG}"

          # Skip when main is already pinned to this tag (unless force).
          # Without this, daily sync re-copies upstream testdata and can reopen
          # no-op / regressive PRs (e.g. help baseline padding vs Version 7.0.2).
          # Prefer peeled commit SHA for annotated tags (refs/tags/X^{}).
          TARGET_SHA="$(git ls-remote --tags https://github.com/microsoft/TypeScript.git "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '
              $2 ~ /\^\{\}$/ { print $1; found=1; exit }
              { commit=$1 }
              END { if (!found && commit != "") print commit }
            ')"
          if [[ -z "${TARGET_SHA}" ]]; then
            echo "Could not resolve SHA for ${TAG}"
            exit 1
          fi
          CURRENT_SHA="$(git ls-tree HEAD microsoft/TypeScript | awk '{print $3; exit}')"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}"
          echo "current_sha=${CURRENT_SHA}"
          if [[ "${FORCE}" != "true" && -n "${CURRENT_SHA}" && "${CURRENT_SHA}" == "${TARGET_SHA}" ]]; then
            echo "Already synced to ${TAG} (${CURRENT_SHA}); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure submodule sparse-checkout at target tag
        if: steps.target.outputs.skip != 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          git submodule sync -- microsoft/TypeScript
          # Shallow fetch of the release tag only (no nested submodules)
          git submodule update --init --depth 1 microsoft/TypeScript
          git -C microsoft/TypeScript fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git -C microsoft/TypeScript checkout -f "${TAG}"
          git -C microsoft/TypeScript sparse-checkout init --cone || true
          git -C microsoft/TypeScript sparse-checkout set tsc
          git add microsoft/TypeScript .gitmodules
          CURRENT_SHA="$(git -C microsoft/TypeScript rev-parse HEAD)"
          echo "Submodule HEAD ${CURRENT_SHA} (want ${TAG} -> ${TARGET_SHA})"
          test "${CURRENT_SHA}" = "${TARGET_SHA}"

      - name: Set up Go
        if: steps.target.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sync script
        if: steps.target.outputs.skip != 'true'
        env:
          SYNC_GENERATE: full
          SYNC_MOD_ALIGN: shared
          SYNC_MOD_DRIFT_CHECK: "1"
          SYNC_VERBOSE: "0"
          SYNC_TS_SYMLINK: "1"
          SYNC_TS_SYMLINK_CLEAN: "1"
        run: |
          chmod +x scripts/sync-internal.sh
          ./scripts/sync-internal.sh

      - name: Create PR
        if: steps.target.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(sync): TypeScript ${{ steps.target.outputs.tag }}"
          title: "chore(sync): TypeScript ${{ steps.target.outputs.tag }}"
          body: |
            Automated synchronization from microsoft/TypeScript `${{ steps.target.outputs.tag }}`:

            - Pin submodule `microsoft/TypeScript` to the release tag
            - Copy `tsc/internal` → `pkg`
            - Rewrite imports and normalize `//go:generate`
            - Copy `tsc/testdata` → `testdata`
            - `go mod tidy`

            After merge (with the `sync` label), `release.yml` will tag this repo `${{ steps.target.outputs.tag }}` and goreleaser will create a GitHub Release.
          # Stable branch name so a re-run updates the same open PR instead of opening another.
          branch: chore/sync-typescript-${{ steps.target.outputs.tag }}
          delete-branch: true
          labels: |
            sync
            chore
            automated
          draft: false
