name: Release Tag

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    # Manual re-run / repair only — not the primary first-release path

permissions:
  contents: write
  actions: write # dispatch GoReleaser (GITHUB_TOKEN tag pushes do not fire workflow push events)

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'sync'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TypeScript submodule (sparse)
        run: |
          set -euo pipefail
          git submodule sync -- microsoft/TypeScript
          git submodule update --init --depth 1 microsoft/TypeScript
          if git -C microsoft/TypeScript sparse-checkout list >/dev/null 2>&1; then
            git -C microsoft/TypeScript sparse-checkout set tsc
          else
            git -C microsoft/TypeScript sparse-checkout init --cone || true
            git -C microsoft/TypeScript sparse-checkout set tsc || true
          fi

      - name: Resolve upstream tag and push matching tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Shallow submodule clones omit tags, so `describe --exact-match` fails
          # even when HEAD is a tagged commit. Resolve via ls-remote instead.
          SHA="$(git -C microsoft/TypeScript rev-parse HEAD)"
          UPSTREAM_TAG="$(
            git -C microsoft/TypeScript ls-remote --tags origin \
              | awk -v sha="$SHA" '
                  $1 == sha && $2 ~ /^refs\/tags\// && $2 !~ /\^\{\}$/ {
                    t = $2; sub(/^refs\/tags\//, "", t); print t
                  }
                  $1 == sha && $2 ~ /\^\{\}$/ {
                    t = $2; sub(/^refs\/tags\//, "", t); sub(/\^\{\}$/, "", t); print t
                  }
                ' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -u \
              | head -n 1 || true
          )"
          if [[ -z "${UPSTREAM_TAG}" ]]; then
            echo "Submodule is not on an exact stable tag; skipping release tag."
            exit 0
          fi
          echo "Upstream tag: ${UPSTREAM_TAG}"

          if [[ ! "${UPSTREAM_TAG}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Upstream tag ${UPSTREAM_TAG} is not a stable vMAJOR.MINOR.PATCH; skipping."
            exit 0
          fi
          MAJOR="${BASH_REMATCH[1]}"

          MODULE="$(awk '/^module /{print $2}' go.mod)"
          if [[ ! "${MODULE}" =~ /v${MAJOR}$ ]]; then
            echo "go.mod module path '${MODULE}' does not end with /v${MAJOR} (required for tag ${UPSTREAM_TAG})."
            echo "Bump the module major path before tagging."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${UPSTREAM_TAG}" >/dev/null; then
            echo "Tag ${UPSTREAM_TAG} already exists on this repo; skipping."
            exit 0
          fi

          # Also skip if the remote already has it (race with push event + PR closed)
          if git ls-remote --tags origin "refs/tags/${UPSTREAM_TAG}" | grep -q .; then
            echo "Tag ${UPSTREAM_TAG} already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${UPSTREAM_TAG}" -m "TypeScript ${UPSTREAM_TAG}"
          git push origin "refs/tags/${UPSTREAM_TAG}"
          echo "Pushed tag ${UPSTREAM_TAG}"

          # Tag pushes authenticated with GITHUB_TOKEN do not trigger other
          # workflows' on.push. Explicitly dispatch GoReleaser instead.
          gh workflow run goreleaser.yml --ref "${UPSTREAM_TAG}" -f tag="${UPSTREAM_TAG}"
          echo "Dispatched GoReleaser for ${UPSTREAM_TAG}"
